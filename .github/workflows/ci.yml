name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Type Check (TypeScript)
        run: npm run typecheck

      - name: Lint Code
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: mock-api-key-for-ci
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: stockpilot-ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: stockpilot-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: stockpilot-ci.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789012:web:abcdef123456
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-MOCKIDFORCI
